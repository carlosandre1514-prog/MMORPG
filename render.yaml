# Publicação gratuita: Render (servidor do jogo) + Supabase (contas e personagens). Passo a passo em docs/HOSPEDAGEM.md.
# Render: New + > Blueprint, apontando para este repositório; depois preencha SUPABASE_URL e SUPABASE_KEY.
services:
  - type: web
    name: aethra
    runtime: node
    plan: free               # o disco do plano gratuito é apagado a cada reinício: por isso os dados vão para o Supabase
    buildCommand: echo "sem dependências para instalar"
    startCommand: npm start
    healthCheckPath: /status
    envVars:
      - key: SUPABASE_URL    # https://xxxx.supabase.co
        sync: false
      - key: SUPABASE_KEY    # chave "service_role" (secreta, nunca vai para o navegador)
        sync: false
